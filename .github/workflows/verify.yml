name: Verify prototype
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fjhy
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: fjhy_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U fjhy -d fjhy_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql://fjhy:test_only@localhost:5432/fjhy_test
      TEST_DATABASE_URL: postgresql://fjhy:test_only@localhost:5432/fjhy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npx tsx database/seed.ts
      - run: npm run assets:build
      - run: npm run build
      - run: npm test
