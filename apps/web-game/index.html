<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>富甲横阳 Web First</title></head><body><div id="app"><div id="game"></div><section id="auth" class="panel"><p>富甲横阳 · Web First</p><h1>进入白石街</h1><input id="account" value="web-traveler" maxlength="40" aria-label="测试账号"/><button id="login">使用测试账号进入</button><small>网页开发入口使用测试登录；微信正式版使用微信登录。</small></section><section id="create" class="panel creation-panel hidden"><p>第一次来到横阳</p><h1>创建角色</h1><div id="gender-buttons" class="segmented"><button data-gender="FEMALE">女</button><button data-gender="MALE">男</button></div><label>肤色 <select id="skin"></select></label><label>完整发型 <select id="hair-choice"></select></label><label>整套服装 <select id="outfit-choice"></select></label><div class="appearance-preview"><canvas id="appearance-preview" width="170" height="172" aria-label="角色预览"></canvas><small>正式逐帧图层待补齐；目前使用安全基础服装预览</small></div><div id="direction-buttons" class="directions"><button data-direction="up">背面</button><button data-direction="left">左侧</button><button data-direction="down">正面</button><button data-direction="right">右侧</button></div><button id="create-player">确认形象，入住客栈</button><small id="create-message" class="form-message" aria-live="polite"></small></section><section id="hud" class="hidden"><div id="status"></div><div id="message"></div><section id="quest-panel"><button id="quest-toggle" type="button" aria-expanded="true"><span>当前任务</span><span id="quest-toggle-icon">▲</span></button><div id="quest"></div></section><section id="shop-panel" class="hidden"><header><span id="shop-sign">店</span><div><small>横阳小镇商铺</small><strong id="shop-title"></strong></div><b id="shop-balance"></b></header><div id="shop-items"></div><p id="shop-feedback"></p></section><div id="inventory"></div><button id="interact">互动</button><div id="dpad"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div></section></div><script type="module" src="/src/main.ts"></script></body></html>
